<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-label="Process: understand, design the journey, build the product, test and refine."><title>Process: understand, design the journey, build the product, test and refine.</title><style>
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.ln{stroke-dasharray:1100;stroke-dashoffset:1100;animation:ln 2.4s .2s cubic-bezier(.6,0,.2,1) forwards}@keyframes ln{to{stroke-dashoffset:0}}.dot{opacity:0;animation:dot .4s forwards}@keyframes dot{to{opacity:1}}</style><line class="ln" x1="40" y1="40" x2="1140" y2="40" stroke="#c5bac4" stroke-opacity=".5" stroke-dasharray="1100"/><g class="dot" style="animation-delay:0.20s"><circle cx="40.0" cy="40" r="15" fill="#191d23" stroke="#e0a8d6" stroke-width="2"/><circle cx="40.0" cy="40" r="5" fill="#e0a8d6"/></g><g class="up" style="animation-delay:0.30s"><text x="38.0" y="104" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#e0a8d6" letter-spacing="2">STEP 01</text><text x="38.0" y="140" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#f1eff1">Understand</text><text x="38.0" y="176" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a3a8b4">Who is the user, what do</text><text x="38.0" y="201" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a3a8b4">they need, what must</text><text x="38.0" y="226" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a3a8b4">this product solve?</text></g><g class="dot" style="animation-delay:0.75s"><circle cx="340.0" cy="40" r="15" fill="#191d23" stroke="#e0a8d6" stroke-width="2"/><circle cx="340.0" cy="40" r="5" fill="#e0a8d6"/></g><g class="up" style="animation-delay:0.85s"><text x="338.0" y="104" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#e0a8d6" letter-spacing="2">STEP 02</text><text x="338.0" y="140" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#f1eff1">Design the journey</text><text x="338.0" y="176" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a3a8b4">Content, flows and UI</text><text x="338.0" y="201" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a3a8b4">for desktop and phone</text><text x="338.0" y="226" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a3a8b4">alike.</text></g><g class="dot" style="animation-delay:1.30s"><circle cx="640.0" cy="40" r="15" fill="#191d23" stroke="#e0a8d6" stroke-width="2"/><circle cx="640.0" cy="40" r="5" fill="#e0a8d6"/></g><g class="up" style="animation-delay:1.40s"><text x="638.0" y="104" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#e0a8d6" letter-spacing="2">STEP 03</text><text x="638.0" y="140" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#f1eff1">Build the product</text><text x="638.0" y="176" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a3a8b4">Frontend, backend, APIs</text><text x="638.0" y="201" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a3a8b4">and database — sized to</text><text x="638.0" y="226" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a3a8b4">the problem.</text></g><g class="dot" style="animation-delay:1.85s"><circle cx="940.0" cy="40" r="15" fill="#191d23" stroke="#e0a8d6" stroke-width="2"/><circle cx="940.0" cy="40" r="5" fill="#e0a8d6"/></g><g class="up" style="animation-delay:1.95s"><text x="938.0" y="104" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#e0a8d6" letter-spacing="2">STEP 04</text><text x="938.0" y="140" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#f1eff1">Test &amp; refine</text><text x="938.0" y="176" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a3a8b4">Ship to a real environment,</text><text x="938.0" y="201" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a3a8b4">check every feature, keep</text><text x="938.0" y="226" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a3a8b4">improving from feedback.</text></g></svg>