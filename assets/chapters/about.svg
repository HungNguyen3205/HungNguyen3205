<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="01 — The person behind the screen: Beyond the lines of code."><title>01 — The person behind the screen: Beyond the lines of code.</title><style>
