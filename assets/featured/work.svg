 -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#f1eff1" fill-opacity=".86">Tasks, members and progress live in too many</text><text x="820" y="284" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#f1eff1" fill-opacity=".86">places to follow.</text><line x1="712" y1="314" x2="1144" y2="314" stroke="rgba(197,186,196,.16)"/><text x="712" y="338" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#e0a8d6" letter-spacing="2">APPROACH</text><text x="820" y="338" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#f1eff1" fill-opacity=".86">One shared system in React, TypeScript and</text><text x="820" y="360" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#f1eff1" fill-opacity=".86">Laravel — many views over one source of data.</text><line x1="712" y1="390" x2="1144" y2="390" stroke="rgba(197,186,196,.16)"/><text x="712" y="414" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#e0a8d6" letter-spacing="2">SIGNATURE</text><text x="820" y="414" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#f1eff1" fill-opacity=".86">The team moves between Kanban, list and</text><text x="820" y="436" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#f1eff1" fill-opacity=".86">calendar without losing the thread.</text><rect x="712" y="474" width="57" height="28" rx="14.0" fill="rgba(197,186,196,.08)" stroke="rgba(197,186,196,.16)"/><text x="740" y="493" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#c5bac4">React</text><rect x="775.0" y="474" width="89" height="28" rx="14.0" fill="rgba(197,186,196,.08)" stroke="rgba(197,186,196,.16)"/><text x="82