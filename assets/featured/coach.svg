dle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#a8eee3">BOTTOM</text><circle cx="228" cy="270" r="5" fill="#10201f" stroke="#a8eee3" stroke-width="2"/><rect x="110" y="254" width="100" height="32" rx="8" fill="#16302e" stroke="#a8eee3" stroke-opacity=".4"/><text x="160" y="275" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#a8eee3">ASCENDING</text><text x="58" y="454" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#a8eee3">10/10</text><text x="58" y="474" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#a8eee3" fill-opacity=".6">tests pass</text><text x="251" y="454" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#a8eee3">15–60</text><text x="251" y="474" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#a8eee3" fill-opacity=".6">FPS stable</text><text x="445" y="454" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#a8eee3">EMA</text><text x="445" y="474" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#a8eee3" fill-opacity=".6">+ hysteresis</text><g class="up"><text x="712" y="104" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#a3a8b4" letter-spacing="2">03 · COMPUTER VISION · AI</text><rect x="1062" y="87" width="82" height="26" rx="13" fill="none" stroke="#c5bac4" stroke-opacity=".5"/><circle cx="1076" cy="100" r="4" fill="#c5bac4" class="pulse"/><text x="1086" y="105" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#c5bac4" letter-spacing="1">SOURCE</text><text x="712" y="162" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#f1eff1" letter-spacing="-1">DANAVA AI Coach</text><text x="712" y="200" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" fill="#c5bac4">The camera doesn't just see — it understands</text><text x="712" y="228" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" fill="#c5bac4">motion.</text><line x1="712" y1="266" x2="1144" y2="266" stroke="rgba(197,186,196,.16)"/><text x="712" y="290" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#e0a8d6" letter-spacing="2">PROBLEM</text><text x="820" y="290" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#f1eff1" fill-opacity=".86">Timer or raw-threshold counting misfires on</text><text x="820" y="312" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#f1eff1" fill-opacity=".86">shaky arms, planks and standing up.</text><line x1="712" y1="342" x2="1144" y2="342" stroke="rgba(197,186,196,.16)"/><text x="712" y="366" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#e0a8d6" letter-spacing="2">APPROACH</text><text x="820" y="366" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#f1eff1" fill-opacity=".86">A motion state machine that counts once per full</text><text x="820" y="388" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#f1eff1" fill-opacity=".86">cycle, smoothed with EMA + hysteresis.</text><line x1="712" y1="418" x2="1144" y2="418" stroke="rgba(197,186,196,.16)"/><text x="712" y="442" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#e0a8d6" letter-spacing="2">SIGNATURE</text><text x="820" y="442" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#f1eff1" fill-opacity=".86">10/10 tests passing, identical results at 15, 30</text><text x="820" y="464" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#f1eff1" fill-opacity=".86">and 60 FPS.</text><rect x="712" y="502" width="86" height="28" rx="14.0" fill="rgba(197,186,196,.08)" stroke="rgba(197,186,196,.16)"/><text x="755" y="521" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#c5bac4">JavaScript</text><rect x="804.0" y="502" width="89" height="28" rx="14.0" fill="rgba(197,186,196,.08)" stroke="rgba(197,186,196,.16)"/><text x="848" y="521" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#c5bac4">MediaPipe</text><rect x="899.0" y="502" width="76" height="28" rx="14.0" fill="rgba(197,186,196,.08)" stroke="rgba(197,186,196,.16)"/><text x="937" y="521" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#c5bac4">WebRTC</text><rect x="981.0" y="502" width="87" height="28" rx="14.0" fill="rgba(197,186,196,.08)" stroke="rgba(197,186,196,.16)"/><text x="1024" y="521" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#c5bac4">Node Test</text></g></svg>