<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="DANAVA AI Coach — The camera doesn't just see — it understands motion."><title>DANAVA AI Coach — The camera doesn't just see — it understands motion.</title><style>
